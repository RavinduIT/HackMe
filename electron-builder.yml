appId: com.hackme.scanner
productName: HackMe
directories:
  output: release
  buildResources: resources
files:
  - dist-electron/**/*
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/**/*.{ts,tsx,map,md}"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/docs/**"
  - "!node_modules/**/examples/**"
win:
  target:
    - nsis
    - portable
  icon: resources/icon.png
  requestedExecutionLevel: asInvoker
mac:
  target:
    - dmg
  icon: resources/icon.png
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HackMe
portable:
  artifactName: HackMe-Portable-${version}.${ext}
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-forge/**/*
npmRebuild: true
